<!DOCTYPE html>
<html lang="it">

<head>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#121316">

<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1.0">



<title>
Gestione Schede
</title>



<link rel="stylesheet"
href="css/style.css">


</head>



<body>



<div class="container">






<!-- ============================= -->
<!-- HOME -->
<!-- ============================= -->


<button

class="secondaryButton"

onclick="location.href='index.html'">

← Home

</button>









<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->


<header class="header">



<div class="logo">

🏋️

</div>




<h1>

Gestisci Schede

</h1>




<p class="subtitle">

Personalizza i tuoi allenamenti

</p>



</header>


<!-- ============================= -->
<!-- BANNER CLIENTE (solo se il trainer -->
<!-- arriva dalla lista clienti) -->
<!-- ============================= -->

<div id="clientBanner" style="display:none;"></div>









<!-- ============================= -->
<!-- GIORNATE (generate dinamicamente) -->
<!-- ============================= -->


<!-- ============================= -->
<!-- SELETTORE GIORNATA -->
<!-- ============================= -->


<div id="dayTabRow" class="dayTabRow">
    <!-- generato da renderDaySections() in workout-manager.js -->
</div>


<div id="dayEditor">
    <!-- generato da renderDaySections() in workout-manager.js -->
</div>









<!-- ============================= -->
<!-- SALVATAGGIO -->
<!-- ============================= -->


<button

class="secondaryButton"

onclick="saveWorkouts()">



💾 Salva modifiche



</button>







</div>










<!-- ============================= -->
<!-- MODALE LIBRERIA ESERCIZI -->
<!-- ============================= -->

<div id="libraryModal" class="modal">

<div class="modalContent libraryModalContent">

<h2>📚 Libreria esercizi</h2>

<div class="libraryTabRow">

<button
id="libraryTabLocal"
class="libraryTabBtn libraryTabActive"
onclick="switchLibraryMode('local')">
🎨 Icone
</button>

<button
id="libraryTabOnline"
class="libraryTabBtn"
onclick="switchLibraryMode('online')">
📷 Foto online
</button>

</div>

<input
id="librarySearch"
class="settingsInput"
type="text"
placeholder="Cerca esercizio..."
oninput="renderLibraryList()">

<div class="libraryFilterRow">

<select
id="libraryMuscleFilter"
class="settingsInput"
onchange="renderLibraryList()">
</select>

<select
id="libraryEquipmentFilter"
class="settingsInput"
onchange="renderLibraryList()">
<option value="">Tutte le attrezzature</option>
<option value="Corpo libero">🤸 Corpo libero</option>
<option value="Pesi liberi">🏋️ Pesi liberi</option>
<option value="Macchine/Cavi">⚙️ Macchine/Cavi</option>
</select>

</div>

<div id="libraryList" class="libraryList"></div>

<button
class="secondaryButton"
onclick="closeLibrary()">
Chiudi
</button>

</div>

</div>


<!-- ============================= -->
<!-- SCRIPT -->
<!-- ============================= -->


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>


<script src="js/supabase-config.js"></script>


<script src="js/auth.js"></script>


<script src="js/config.js"></script>


<script src="js/storage.js"></script>


<script src="js/workout-manager.js"></script>



</body>


</html>
