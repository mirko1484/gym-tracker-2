<!DOCTYPE html>
<html lang="it">

<head>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">

<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1.0">



<title>
Gestione Schede
</title>



<link rel="stylesheet"
href="css/style.css">


</head>



<body>



<div class="container">






<!-- ============================= -->
<!-- HOME -->
<!-- ============================= -->


<button

class="secondaryButton"

onclick="location.href='index.html'">

← Home

</button>









<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->


<header class="header">



<div class="logo">

🏋️

</div>




<h1>

Gestisci Schede

</h1>




<p class="subtitle">

Personalizza i tuoi allenamenti

</p>



</header>









<!-- ============================= -->
<!-- GIORNATA A -->
<!-- ============================= -->


<section class="statsCard">



<h2>

🔥 Giornata A

</h2>




<div

id="dayAList">


</div>





<div class="dayActionsRow">

<button

class="dayButton dayA"

onclick="addExercise('A')">

➕ Manuale

</button>

<button

class="dayButton dayA"

onclick="openLibrary('A')">

📚 Libreria

</button>

</div>



</section>









<!-- ============================= -->
<!-- GIORNATA B -->
<!-- ============================= -->


<section class="statsCard">



<h2>

💪 Giornata B

</h2>




<div

id="dayBList">


</div>





<div class="dayActionsRow">

<button

class="dayButton dayB"

onclick="addExercise('B')">

➕ Manuale

</button>

<button

class="dayButton dayB"

onclick="openLibrary('B')">

📚 Libreria

</button>

</div>



</section>









<!-- ============================= -->
<!-- GIORNATA C -->
<!-- ============================= -->


<section class="statsCard">



<h2>

⚡ Giornata C

</h2>




<div

id="dayCList">


</div>





<div class="dayActionsRow">

<button

class="dayButton dayC"

onclick="addExercise('C')">

➕ Manuale

</button>

<button

class="dayButton dayC"

onclick="openLibrary('C')">

📚 Libreria

</button>

</div>



</section>









<!-- ============================= -->
<!-- SALVATAGGIO -->
<!-- ============================= -->


<button

class="secondaryButton"

onclick="saveWorkouts()">



💾 Salva modifiche



</button>







</div>










<!-- ============================= -->
<!-- MODALE LIBRERIA ESERCIZI -->
<!-- ============================= -->

<div id="libraryModal" class="modal">

<div class="modalContent libraryModalContent">

<h2>📚 Libreria esercizi</h2>

<input
id="librarySearch"
class="settingsInput"
type="text"
placeholder="Cerca esercizio..."
oninput="renderLibraryList()">

<div class="libraryFilterRow">

<select
id="libraryMuscleFilter"
class="settingsInput"
onchange="renderLibraryList()">
</select>

<select
id="libraryEquipmentFilter"
class="settingsInput"
onchange="renderLibraryList()">
<option value="">Tutte le attrezzature</option>
<option value="Corpo libero">🤸 Corpo libero</option>
<option value="Pesi liberi">🏋️ Pesi liberi</option>
<option value="Macchine/Cavi">⚙️ Macchine/Cavi</option>
</select>

</div>

<div id="libraryList" class="libraryList"></div>

<button
class="secondaryButton"
onclick="closeLibrary()">
Chiudi
</button>

</div>

</div>


<!-- ============================= -->
<!-- SCRIPT -->
<!-- ============================= -->


<script src="js/config.js"></script>


<script src="js/storage.js"></script>


<script src="js/workout-manager.js"></script>



</body>


</html>
