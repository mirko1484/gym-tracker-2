<!DOCTYPE html>
<html lang="it">

<head>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#121316">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard — Gym Tracker</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">
            🏋️
        </div>

        <h1 id="dashboardTitle">
        Gym Tracker
        </h1>

        <p class="subtitle" id="dashboardRole">
        Caricamento...
        </p>

    </header>


    <div id="dashboardContent">
    </div>


    <button
    class="secondaryButton"
    style="margin-top:20px;"
    onclick="logoutUser()">

    Esci

    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>

<script>


document.addEventListener("DOMContentLoaded", async function(){


    const profile =
        await requireAuth();

    if(!profile){

        return;

    }


    const roleLabels = {

        admin: "Amministratore",
        trainer: "Trainer",
        customer: "Cliente"

    };


    document.getElementById("dashboardRole").textContent =
        "Ciao " +
        profile.full_name +
        " — " +
        (roleLabels[profile.role] || profile.role);


    const content =
        document.getElementById("dashboardContent");


    if(profile.role === "admin"){

        content.innerHTML = `

        <section class="statsCard">

        <h2>👑 Amministrazione</h2>

        <p class="librarySubtitle" style="text-align:left;padding:0 0 15px;">
        Invita trainer e clienti, gestisci gli accessi.
        </p>

        <button class="dayButton dayA" onclick="location.href='admin.html'">
        Apri pannello admin
        </button>

        </section>


        <section class="statsCard">

        <h2>💪 Area Trainer</h2>

        <p class="librarySubtitle" style="text-align:left;padding:0 0 15px;">
        Come admin puoi gestire anche le schede dei clienti, come un trainer.
        </p>

        <button class="dayButton dayB" onclick="location.href='trainer.html'">
        I miei clienti
        </button>

        </section>

        `;

    }
    else if(profile.role === "trainer"){

        content.innerHTML = `

        <section class="statsCard">

        <h2>💪 Area Trainer</h2>

        <p class="librarySubtitle" style="text-align:left;padding:0 0 15px;">
        Gestisci i tuoi clienti e le loro schede.
        </p>

        <button class="dayButton dayB" onclick="location.href='trainer.html'">
        I miei clienti
        </button>

        </section>

        `;

    }
    else{

        // Il cliente non ha bisogno di una pagina intermedia:
        // la sua vera home (con le schede vere) è index.html

        window.location.href = "index.html";

        return;

    }


});


</script>

</body>

</html>
