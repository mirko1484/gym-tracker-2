<!DOCTYPE html>
<html lang="it">

<head>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#121316">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imposta password — Gym Tracker</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">
            🔑
        </div>

        <h1>Gym Tracker</h1>

        <p class="subtitle">
        Imposta la tua password
        </p>

    </header>


    <section class="statsCard">

        <div id="setPasswordMessage" style="display:none;"></div>

        <div id="setPasswordForm">

            <label class="formLabel">
            Nuova password
            </label>

            <input
            id="newPassword"
            class="settingsInput"
            type="password"
            autocomplete="new-password"
            placeholder="Almeno 6 caratteri">

            <label class="formLabel">
            Conferma password
            </label>

            <input
            id="confirmPassword"
            class="settingsInput"
            type="password"
            autocomplete="new-password"
            placeholder="Ripeti la password">

            <button
            class="dayButton dayA"
            style="margin-top:15px;"
            onclick="handleSetPassword()">
            Conferma e accedi
            </button>

        </div>

    </section>


    <footer class="footer">
        Gym Tracker v2.0
    </footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>

<script>


function showSetPasswordMessage(text, isError){

    const box =
        document.getElementById("setPasswordMessage");

    box.textContent = text;

    box.style.display = "block";

    box.style.padding = "12px 14px";

    box.style.borderRadius = "10px";

    box.style.marginBottom = "16px";

    box.style.fontSize = "14px";

    box.style.background =
        isError ?
            "rgba(255,68,35,.15)" :
            "rgba(47,217,124,.15)";

    box.style.color =
        isError ? "#ff4423" : "#2fd97c";

}



document.addEventListener("DOMContentLoaded", async function(){


    // Il link di invito porta il token nell'URL: il client
    // Supabase lo rileva e apre automaticamente una sessione.
    // Aspettiamo un istante e poi verifichiamo che sia successo.

    await new Promise(resolve => setTimeout(resolve, 400));

    const { data: { session } } =
        await supabaseClient.auth.getSession();


    if(!session){

        document.getElementById("setPasswordForm").style.display = "none";

        showSetPasswordMessage(
            "Link non valido o scaduto. Chiedi un nuovo invito al tuo amministratore.",
            true
        );

    }


});



async function handleSetPassword(){


    const password =
        document.getElementById("newPassword").value;

    const confirm =
        document.getElementById("confirmPassword").value;


    if(!password || password.length < 6){

        showSetPasswordMessage(
            "La password deve avere almeno 6 caratteri",
            true
        );

        return;

    }


    if(password !== confirm){

        showSetPasswordMessage(
            "Le due password non coincidono",
            true
        );

        return;

    }


    const { error } =
        await supabaseClient.auth.updateUser({
            password: password
        });


    if(error){

        showSetPasswordMessage(
            "Errore: " + error.message,
            true
        );

        return;

    }


    showSetPasswordMessage(
        "Password impostata ✅ Ti porto alla tua area...",
        false
    );

    setTimeout(function(){

        window.location.href = "dashboard.html";

    }, 1200);


}


</script>

</body>

</html>
