<!DOCTYPE html>
<html lang="it">

<head>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#121316">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Tracker</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="header">

        <div class="logo">
            💪
        </div>

        <h1>Gym Tracker</h1>

        <p class="subtitle">
            Il tuo diario di allenamento
        </p>

    </header>



    <!-- ========================= -->
    <!-- PROFILO -->
    <!-- ========================= -->

    <section class="statsCard profileCard">

        <div class="profileAvatar">
            👤
        </div>

        <div class="profileInfo">

            <h2 id="welcomeName">

                Benvenuto

            </h2>

            <p id="profileGoal">

                Nessun obiettivo impostato

            </p>

        </div>

    </section>



    <!-- ========================= -->
    <!-- STATISTICHE -->
    <!-- ========================= -->

    <section class="statsCard">

        <h2>Statistiche</h2>

        <div class="statRow">
            <span>Allenamenti</span>
            <span id="totalWorkouts">0</span>
        </div>

        <div class="statRow">
            <span>Ultimo allenamento</span>
            <span id="lastWorkout">--</span>
        </div>

        <div class="statRow">
            <span>Ore totali</span>
            <span id="totalHours">0</span>
        </div>

        <div class="statRow">
            <span>Tempo medio</span>
            <span id="averageTime">--</span>
        </div>

    </section>



    <!-- ========================= -->
    <!-- ULTIMO ALLENAMENTO -->
    <!-- ========================= -->

    <section class="statsCard">

        <h2>Ultima sessione</h2>

        <div id="lastWorkoutInfo">

            Nessun allenamento registrato

        </div>

    </section>



    <!-- ========================= -->
    <!-- NUOVO ALLENAMENTO -->
    <!-- ========================= -->

    <section class="workouts">

    <h2>Inizia Allenamento</h2>


    <div id="workoutButtonsContainer">
        <!-- generato dinamicamente da app.js -->
    </div>


</section>


    <!-- ========================= -->
    <!-- MENU -->
    <!-- ========================= -->

    <section class="homeMenu">

        <button
            class="secondaryButton"
            onclick="location.href='history.html'">

            📅
            <br>
            Cronologia

        </button>
		
		<button
			class="secondaryButton"
			onclick="location.href='workout-manager.html'">

			🏋️ Gestisci schede

		</button>

        <button
            class="secondaryButton"
            onclick="location.href='progress.html'">

            📈
            <br>
            Progressi

        </button>

        <button
            class="secondaryButton"
            onclick="location.href='settings.html'">

            ⚙️
            <br>
            Profilo

        </button>

    </section>



    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="footer">

        Gym Tracker v2.0

    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>

</body>

</html>
